# Local or single-server production: docker compose up -d --build
services:
  academy:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # behind HTTPS (a reverse proxy or a platform) keep secure cookies on; for plain http on localhost set COOKIE_SECURE=false
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - academy-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  academy-data:
