# Builds the standalone JARVIS web app and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: JARVIS web app
on:
  push:
    branches: [main, master, claude/jarvis-ai-system-spec-oxc6aq]
    paths: ['jarvis/**', '.github/workflows/jarvis-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: jarvis } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: jarvis/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build:webapp
      - uses: actions/upload-pages-artifact@v3
        with: { path: jarvis/dist/webapp }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
