[package]
name = "jarvis-desktop"
version = "0.1.0"
edition = "2021"
description = "JARVIS desktop shell: tray, global shortcuts, push-to-talk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
