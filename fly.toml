# Deploy to Fly.io:
#   fly launch --no-deploy        (pick an app name, then put it below)
#   fly volumes create academy_data --size 1
#   fly deploy
app = "claude-code-academy"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  TRUST_PROXY = "true"
  COOKIE_SECURE = "true"

[[mounts]]
  source = "academy_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"
